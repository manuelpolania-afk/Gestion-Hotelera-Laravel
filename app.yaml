# Aplicación en Wasmer Edge: https://hotel-laravel-manuel19.wasmer.app
# APP_KEY y DB_PORT son secretos guardados en Wasmer (no van en este archivo).
kind: wasmer.io/App.v0
name: hotel-laravel
app_id: da_nP7IptBUxgv3
owner: manuel19
package: .
debug: false
cli_args:
  - "-t"
  - "/app/public"
  - "-S"
  - "localhost:8080"
env:
  APP_NAME: "Casa Hotel Mr Angel"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://hotel-laravel-manuel19.wasmer.app
  ASSET_URL: https://hotel-laravel-manuel19.wasmer.app
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: es
  DB_CONNECTION: mysql
  SESSION_DRIVER: cookie
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr
  VIEW_COMPILED_PATH: /tmp/views
scaling:
  mode: single_concurrency
locality:
  regions:
    - fr-roub1
capabilities:
  database:
    engine: mysql
jobs:
  # Solo migraciones: el seeder crea test@example.com con create() y fallaría
  # en cada despliegue posterior al primero.
  - name: migrate
    trigger: pre-deployment
    timeout: 10m
    action:
      execute:
        command: run
        cli_args: ["/app/artisan", "migrate", "--force"]
